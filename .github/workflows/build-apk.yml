name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Aarav source photo
        run: |
          SIZE=$(stat -c%s app/src/main/res/drawable/aarav_photo.jpg)
          echo "Aarav source photo bytes: $SIZE"
          test "$SIZE" -gt 3000
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('app/src/main/res/drawable/aarav_photo.jpg').read_bytes()
          assert raw.startswith(b'\xff\xd8'), 'Not a valid JPEG header'
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify photo inside APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'res/drawable/aarav_photo.jpg'
          SIZE=$(unzip -l app/build/outputs/apk/debug/app-debug.apk | awk '/res\/drawable\/aarav_photo.jpg/{print $1}')
          echo "Packaged Aarav photo bytes: $SIZE"
          test "$SIZE" -gt 3000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlantsAroundUs-APK
          path: app/build/outputs/apk/debug/app-debug.apk
